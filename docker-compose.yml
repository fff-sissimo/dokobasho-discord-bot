services:
  traefik:
    image: "traefik"
    restart: always
    command:
      - "--api=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.4.6
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - NODES_EXCLUDE=[]
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_PROXY_HOPS=1
      - N8N_EXECUTIONS_PROCESS=main
      - N8N_ENABLE_NODE_EXECUTIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_VERSION=${NOTION_VERSION:-2022-06-28}
      - NOTION_API_BASE_URL=${NOTION_API_BASE_URL:-https://api.notion.com/v1}
      - OPENCLAW_N8N_DISPATCH_SECRET=${OPENCLAW_N8N_DISPATCH_SECRET:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - /local-files:/files
      - /data/n8n-video:/data/n8n-video

  n8n-runners:
    image: n8nio/runners:2.4.6
    restart: always
    depends_on:
      - n8n
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=15
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_VERSION=${NOTION_VERSION:-2022-06-28}
      - NOTION_API_BASE_URL=${NOTION_API_BASE_URL:-https://api.notion.com/v1}
      - OPENCLAW_N8N_DISPATCH_SECRET=${OPENCLAW_N8N_DISPATCH_SECRET:-}

  openclaw-api:
    profiles:
      - openclaw
    image: dokobasho-openclaw-api:${OPENCLAW_API_IMAGE_TAG:-local}
    build: ./openclaw-api
    restart: always
    environment:
      - OPENCLAW_API_KEY=${OPENCLAW_API_KEY}
      - OPENCLAW_API_HOST=0.0.0.0
      - OPENCLAW_API_PORT=8788
      - OPENCLAW_WORKSPACE_DIR=/opt/dokobasho/openclaw
      - OPENCLAW_AGENT_MODE=${OPENCLAW_AGENT_MODE:-local}
      - OPENCLAW_AGENT_ID=${OPENCLAW_AGENT_ID:-}
      - OPENCLAW_AGENT_SESSION_ID=${OPENCLAW_AGENT_SESSION_ID:-dokobasho-fairy-discord-v1}
      - OPENCLAW_AGENT_SESSION_SCOPE=${OPENCLAW_AGENT_SESSION_SCOPE:-request}
      - OPENCLAW_AGENT_THINKING=${OPENCLAW_AGENT_THINKING:-low}
      - OPENCLAW_AGENT_TIMEOUT_SECONDS=${OPENCLAW_AGENT_TIMEOUT_SECONDS:-60}
      - OPENCLAW_REQUEST_TIMEOUT_MS=${OPENCLAW_REQUEST_TIMEOUT_MS:-70000}
      - OPENCLAW_NOTION_ENABLED=${OPENCLAW_NOTION_ENABLED:-false}
      - OPENCLAW_NOTION_TOKEN=${OPENCLAW_NOTION_TOKEN:-}
      - OPENCLAW_NOTION_VERSION=${OPENCLAW_NOTION_VERSION:-2025-09-03}
      - OPENCLAW_NOTION_API_BASE_URL=${OPENCLAW_NOTION_API_BASE_URL:-https://api.notion.com/v1}
      - OPENCLAW_NOTION_MAX_RESULTS=${OPENCLAW_NOTION_MAX_RESULTS:-5}
      - OPENCLAW_NOTION_MAX_RESULT_CHARS=${OPENCLAW_NOTION_MAX_RESULT_CHARS:-4000}
      - OPENCLAW_N8N_DISPATCH_ENABLED=${OPENCLAW_N8N_DISPATCH_ENABLED:-true}
      - OPENCLAW_N8N_DISPATCH_URL=${OPENCLAW_N8N_DISPATCH_URL:-http://n8n:5678/webhook/openclaw/workflow-dispatch}
      - OPENCLAW_N8N_DISPATCH_SECRET=${OPENCLAW_N8N_DISPATCH_SECRET:-}
      - OPENCLAW_N8N_ALLOWED_WORKFLOWS=${OPENCLAW_N8N_ALLOWED_WORKFLOWS:-notion.safe_ops}
      - OPENCLAW_N8N_DISPATCH_TIMEOUT_MS=${OPENCLAW_N8N_DISPATCH_TIMEOUT_MS:-20000}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ${OPENCLAW_WORKSPACE_HOST_DIR:-../dokobasho-fairy-openclaw}:/opt/dokobasho/openclaw:ro
      - ${OPENCLAW_STATE_HOST_DIR:-./openclaw-state}:/root/.openclaw

  discord-bot:
    environment:
      - NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN}
    image: dokobasho-discord-bot:${DISCORD_BOT_IMAGE_TAG:-local}
    build: ./discord-bot
    restart: always
    depends_on:
      - n8n
    env_file:
      - ./discord-bot/.env
    volumes:
      - ${GOOGLE_SA_KEY_FILE:-./discord-bot/google-service-key.json}:/app/keys/google-service-key.json:ro
      - ${PERMANENT_MEMORY_HOST_DIR:-./discord-bot/permanent-memory}:/app/permanent-memory

  discord-scheduler:
    environment:
      - NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN}
    image: dokobasho-discord-bot:${DISCORD_BOT_IMAGE_TAG:-local}
    restart: always
    env_file:
      - ./discord-bot/.env
    command: ["node", "scheduler.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const fs=require('fs');const p=process.env.SCHEDULER_HEARTBEAT_PATH||'/tmp/discord-scheduler-heartbeat';const maxAgeMs=120000;const s=fs.statSync(p);if(Date.now()-s.mtimeMs>maxAgeMs) process.exit(1);\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ${GOOGLE_SA_KEY_FILE:-./discord-bot/google-service-key.json}:/app/keys/google-service-key.json:ro

volumes:
  traefik_data:
    external: true
  n8n_data:
    external: true
